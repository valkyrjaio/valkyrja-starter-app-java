name: Create a New Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - feature
          - yearly
          - rc

run-name: "Release ${{ inputs.bump }} bump on ${{ github.ref_name }}"

permissions:
  contents: write

jobs:
  release:
    uses: valkyrjaio/.github/.github/workflows/_java-create-release.yml@9a50807409916719ee5af7a9061bd4ddedc8bc03
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}
      dependencies: |
        [
          {"name": "Application",  "directory": "."},
          {"name": "Spotless",     "directory": ".github/ci/spotless"},
          {"name": "ArchUnit",     "directory": ".github/ci/archunit"},
          {"name": "ErrorProne",   "directory": ".github/ci/errorprone"},
          {"name": "SpotBugs",     "directory": ".github/ci/spotbugs"},
          {"name": "JUnit",        "directory": ".github/ci/junit"},
          {"name": "Sindri JUnit", "directory": ".github/ci/sindri-junit"}
        ]
