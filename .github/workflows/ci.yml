name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  spotless:
    name: Spotless
    uses: valkyrjaio/.github/.github/workflows/_java-spotless.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/spotless
      paths: |
        ci:
          - '.github/ci/spotless/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/spotless/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
          - '.github/ci/sindri-junit/src/test/**/*.java'
    secrets: inherit

  archunit:
    name: ArchUnit
    uses: valkyrjaio/.github/.github/workflows/_java-archunit.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/archunit
      copy-example-sources: true
      paths: |
        ci:
          - '.github/ci/archunit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/archunit/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  errorprone:
    name: ErrorProne
    uses: valkyrjaio/.github/.github/workflows/_java-errorprone.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/errorprone
      copy-example-sources: true
      paths: |
        ci:
          - '.github/ci/errorprone/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/errorprone/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  spotbugs:
    name: SpotBugs
    uses: valkyrjaio/.github/.github/workflows/_java-spotbugs.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/spotbugs
      copy-example-sources: true
      paths: |
        ci:
          - '.github/ci/spotbugs/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/spotbugs/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  junit:
    name: JUnit
    uses: valkyrjaio/.github/.github/workflows/_java-junit.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/junit
      copy-example-sources: true
      paths: |
        ci:
          - '.github/ci/junit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/junit/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.java'
    secrets: inherit

  # Unlike `junit` (which copies the empty *.example.java stubs), this job runs Sindri to generate
  # the real App*Data classes and tests the application as it runs in production — an isolated env
  # so stubbed and generated results never mingle, and a way to exercise Sindri against a real app.
  sindri-junit:
    name: Sindri JUnit
    # Pinned ahead of the other jobs to the commit that added the `upload-coverage` input, which is
    # not in a .github release yet. The workflow-ref update automation brings this back in line
    # with the rest at the next release.
    uses: valkyrjaio/.github/.github/workflows/_java-junit.yml@2574d99d121f5598686a6ea8f29002e1f6c900d6
    with:
      ci-directory: .github/ci/sindri-junit
      # This job compiles the whole app but only asserts the generated App*Data classes, so its
      # JaCoCo report counts every untested controller, command and provider as missed and does
      # not describe the app's coverage. The `junit` job is the one that does.
      upload-coverage: false
      paths: |
        ci:
          - '.github/ci/sindri-junit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/sindri-junit/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.java'
    secrets: inherit
