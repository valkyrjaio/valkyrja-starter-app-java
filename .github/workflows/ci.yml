name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  spotless:
    name: Spotless
    uses: valkyrjaio/.github/.github/workflows/_spotless-java.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    with:
      ci-directory: .github/ci/spotless
      paths: |
        ci:
          - '.github/ci/spotless/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/spotless/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
    secrets: inherit

  archunit:
    name: ArchUnit
    uses: valkyrjaio/.github/.github/workflows/_archunit-java.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    with:
      ci-directory: .github/ci/archunit
      copy-example-sources: true
      paths: |
        ci:
          - '.github/ci/archunit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/archunit/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
    secrets: inherit

  errorprone:
    name: ErrorProne
    uses: valkyrjaio/.github/.github/workflows/_errorprone-java.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    with:
      ci-directory: .github/ci/errorprone
      copy-example-sources: true
      paths: |
        ci:
          - '.github/ci/errorprone/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/errorprone/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
    secrets: inherit

  spotbugs:
    name: SpotBugs
    uses: valkyrjaio/.github/.github/workflows/_spotbugs-java.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    with:
      ci-directory: .github/ci/spotbugs
      copy-example-sources: true
      paths: |
        ci:
          - '.github/ci/spotbugs/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/spotbugs/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
    secrets: inherit

  junit:
    name: JUnit
    uses: valkyrjaio/.github/.github/workflows/_junit-java.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    with:
      ci-directory: .github/ci/junit
      copy-example-sources: true
      paths: |
        ci:
          - '.github/ci/junit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/junit/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
    secrets: inherit

  # Unlike `junit` (which copies the empty *.example.java stubs), this job runs Sindri to generate
  # the real App*Data classes and tests the application as it runs in production — an isolated env
  # so stubbed and generated results never mingle, and a way to exercise Sindri against a real app.
  sindri-junit:
    name: Sindri JUnit
    uses: valkyrjaio/.github/.github/workflows/_junit-java.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    with:
      ci-directory: .github/ci/sindri-junit
      paths: |
        ci:
          - '.github/ci/sindri-junit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/sindri-junit/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.java'
    secrets: inherit
