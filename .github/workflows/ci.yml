name: CI

on:
  push:
    branches: [ 'master', '*.x' ]

  pull_request:
    # `edited` is deliberately absent. It fires for a title or description edit, and this workflow
    # checks file content, which an edit cannot change. Running it on an edit would cost the full
    # tool suite for a typo. Guarding the jobs on `github.event.changes` instead does not work and
    # is not safe: a caller job skipped by `if:` never produces the `<job> / <job>` context the
    # required status checks wait for, so the pull request blocks; and a guard inside the job would
    # report success without running the tools, so an edit on a red pull request would turn it
    # green. Pull request metadata is checked by `pr.yml`, which does subscribe to `edited`.
    types: [ opened, synchronize, reopened ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:


  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@c56ebc8606ffb9031fd45aec671f7ad5324e86db
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  markdown-check:
    name: Markdown Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_markdown-check.yml@c56ebc8606ffb9031fd45aec671f7ad5324e86db
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  sindri-junit:
    name: Sindri JUnit
    uses: valkyrjaio/.github/.github/workflows/_java-junit.yml@c56ebc8606ffb9031fd45aec671f7ad5324e86db
    with:
      ci-directory: .github/ci/sindri-junit
      # This job compiles the whole app but only asserts the generated App*Data classes, so its
      # JaCoCo report counts every untested controller, command and provider as missed and does
      # not describe the app's coverage. The `junit` job is the one that does.
      upload-coverage: false
      paths: |
        ci:
          - '.github/ci/sindri-junit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/sindri-junit/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.java'
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  # A check's name is built from every job name down the call chain, so this composes
  # as `CI / Tools / <Tool> / …`.
  tools:
    name: Tools
    uses: valkyrjaio/.github/.github/workflows/_java-ci-tools.yml@c56ebc8606ffb9031fd45aec671f7ad5324e86db
    with:
      copy-example-sources: true
      # The two entry point scripts are Spotless targets, so they are sources for the filter
      # too. Without them an edit to either script reaches no tool and the header goes
      # unchecked, which is the gap that let them carry the wrong package identifier.
      source-paths: |
        app/src/**/*.java
        .github/ci/junit/src/test/**/*.java
        .github/ci/sindri-junit/src/test/**/*.java
        app/bin/cli
        app/public/index
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
